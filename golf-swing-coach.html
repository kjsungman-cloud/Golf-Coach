<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골프 스윙 코치 (AI 포즈 분석)</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1f3f2;--bd:#d5d9d7;--ac:#1a8f4c;--bad:#d64545;--mid:#e0a000}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--fg:#e8ecea;--card:#212724;--bd:#37403b;--ac:#3ecf80;--bad:#ff6b6b;--mid:#ffc542}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:12px;max-width:900px;padding-bottom:env(safe-area-inset-bottom,12px)}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:16px;margin:16px 0 6px}
.box{position:relative;background:#000;border-radius:10px;overflow:hidden;line-height:0}
video{width:100%;max-height:62vh;display:block}.box canvas{position:absolute;left:0;top:0;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select,.btn,input[type=number]{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}input[type=number]{width:70px}
label{font-size:13px;display:flex;gap:6px;align-items:center}
#st{font-size:13px;min-height:20px}
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
.card b.t{font-size:15px}.card .d{font-size:13px;opacity:.9;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.act,.on{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}#sheet img{width:100%;border-radius:8px;margin-top:6px}.score{font-size:34px;font-weight:700}.small{font-size:12px;opacity:.75}
</style>
</head>
<body>
<h1>⛳ 골프 스윙 코치 — AI 포즈 분석</h1>
<div class="box" id="box"><video id="v" playsinline muted controls></video><canvas id="c"></canvas></div>
<div class="row">
  <label class="btn">📂 영상 선택<input type="file" id="f" accept="video/*" hidden></label>
  <select id="view"><option value="front">정면(face-on) 촬영</option><option value="side">측면 = 후방(DTL, 테이크백 쪽) 촬영</option></select>
  <select id="club"><option value="I">아이언</option><option value="D">드라이버</option><option value="P">퍼터</option></select>
  <select id="hand"><option value="R">오른손잡이</option><option value="L">왼손잡이</option></select>
  <label>촬영 fps <input id="fps" type="number" value="30" min="10" max="480"></label>
  <button id="go" class="p">분석 시작</button>
</div>
<div id="st">영상을 선택하고 촬영 시점·fps를 맞춘 뒤 “분석 시작”을 누르세요. (처음 한 번 AI 모델을 내려받습니다)</div>
<div class="row">
  <button id="play">▶ 재생</button><button id="pz" class="on">🦴 포즈 ON</button>
  <button id="b3">🧊 3D 보기</button>
  <button id="ct" class="on">⛳ 클럽궤적 ON</button>
  <span id="spd" class="row" style="margin:0"><button data-r="0.25">0.25x</button><button data-r="0.5" class="act">0.5x</button><button data-r="1">1.0x</button></span>
</div>
<div class="row">
  <label>스틸컷 <select id="n"><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option><option>11</option><option>12</option></select>컷</label>
  <button id="shot" class="p">📸 스틸컷 만들기</button>
</div>
<div id="v3box" hidden>
  <div class="row"><button data-y="0.5" data-p="-0.2">3D 기본</button><button data-y="0" data-p="0">정면</button><button data-y="1.5708" data-p="0">측면</button><button data-y="0" data-p="-1.5708">위에서</button><span class="small">드래그로 회전</span></div>
  <canvas id="c3" style="width:100%;height:320px;background:#0d1210;border-radius:10px;touch-action:none;display:block;position:relative;pointer-events:auto;cursor:grab"></canvas>
  <div class="small">3D 골격은 단일 영상에서 추정한 값이라 앞뒤(깊이) 방향은 오차가 큽니다. 바닥 격자는 어드레스 발 높이입니다.</div>
</div>
<div class="row" id="ph"></div>
<div id="sheet"></div>
<div id="res"></div>
<p class="small">단일 2D 영상 기반의 추정치입니다. 정면과 후방을 각각 촬영해 두 번 분석하면 더 완전합니다. 통증·부상이 있으면 전문 코치/의료진과 상담하세요.</p>

<script type="module">

  const back=v.currentTime;v.pause();$('shot').disabled=true;

    const t=t0+(t1-t0)*i/(N-1),x=(i%cols)*tw,y=Math.floor(i/cols)*th;st.textContent='스틸컷 만드는 중 '+(i+1)+'/'+N;
    await seek(t);g.drawImage(v,x,y,tw,th);
    if(showPose&&S){g.save();g.translate(x,y);g.beginPath();g.rect(0,0,tw,th);g.clip();paint(g,tw,th,t,tw/700);g.restore()}
    g.font='bold '+Math.round(tw/22)+'px sans-serif';g.lineWidth=3;g.strokeStyle='#000';g.fillStyle='#fff';
    const lb=(i+1)+' · '+(t-t0).toFixed(2)+'s';g.strokeText(lb,x+6,y+th-8);g.fillText(lb,x+6,y+th-8);
  }
  await seek(back);$('shot').disabled=false;
  const url=sh.toDataURL('image/png');
  $('sheet').innerHTML='<h2>스윙 스틸컷 '+N+'컷</h2><img src="'+url+'" alt="swing still cuts"><div class="row"><a class="btn" download="swing-stills-'+N+'.png" href="'+url+'">PNG 저장</a></div>';
  st.textContent='스틸컷 완료. 이미지를 길게 누르거나 PNG 저장으로 내려받으세요.';
}
$('shot').onclick=()=>still().catch(e=>{$('shot').disabled=false;st.textContent='오류: '+e.message});

$('f').onchange=e=>{const f=e.target.files[0];if(f){v.src=URL.createObjectURL(f);S=null;PH=null;W3=[];CT=null;CD=null;GF=[];$('sheet').innerHTML='';$('res').innerHTML='';$('ph').innerHTML='';st.textContent='불러옴: '+f.name}};
$('go').onclick=async()=>{
  if(!v.videoWidth){st.textContent='먼저 영상을 선택하세요.';return}
  $('go').disabled=true;
  try{const n=await analyze(),P=isP()?phasesPutt(n):phases(n);PH=P;render(isP()?puttMetrics(P):metrics(P),P,n);st.textContent='클럽 궤적 추적 중…';await new Promise(r=>setTimeout(r,0));try{CT=trackClub(GF,320,GF[0].length/320,v.videoWidth,v.videoHeight,$('club').value,P,n);CD=CT.length>1?dens(CT):null}catch(e){console.warn(e);CT=null;CD=null}st.textContent='분석 완료. 아래 버튼으로 어드레스·탑·임팩트 구간을 확인하세요.';v.currentTime=(P.top+.5)*dt}
  catch(e){st.textContent='오류: '+e.message;console.error(e)}
  $('go').disabled=false;
};
</script>
</body>
